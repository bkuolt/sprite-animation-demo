version: '3'

tasks:
  clean:
    desc: Deletes the build folder for a clean restart
    cmds:
      - rm -rf build/
      - rm -f CMakeUserPresets.json

  setup:
    desc: Installs all C++ dependencies via Conan
    cmds:
   #   - conan profile detect
      - conan install . --build=missing -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

  shaders:
    desc: Compiles GLSL shaders to SPIR-V using the Python script
    cmds:
      - python3 ./compile_shaders.py
    sources:
      - src/*.vs
      - src/*.fs

  build:
    deps: [shaders]
    desc: Configures and compiles the project
    cmds:
      - cmake --preset conan-release
      - cmake --build --preset conan-release

  run:
    deps: [build]
    desc: Runs the compiled application
    cmds:
      # With the cmake_layout, the executable is now usually located directly in the Release folder.
      # (Adjust the name 'app' here to match your CMakeLists.txt if necessary)
      - ./build/Release/app