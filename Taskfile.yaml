version: '3'

tasks:
  clean:
    desc: Deletes build artifacts and CMake presets
    cmds:
      - rm -rf build/
      - rm -f CMakeUserPresets.json

  lock:
    desc: Creates or updates the Conan lockfile
    cmds:
      - conan lock create .

  setup:
    desc: Installs dependencies via Conan using the lockfile
    cmds:
      - conan install . --lockfile=conan.lock --build=missing -c tools.system.package_manager:mode=install

  shaders:
    desc: Compiles GLSL shaders to SPIR-V binaries
    cmds:
      - ./compile-shaders.sh
    sources:
      - src/shaders/main.vs
      - src/shaders/main.fs
      - src/shaders/text.vs
      - src/shaders/text.fs
    generates:
      - assets/main.vert.spv
      - assets/main.frag.spv
      - assets/text.vert.spv
      - assets/text.frag.spv

  build:
    deps: [shaders]
    desc: Configures and builds the project using CMake preset
    cmds:
      - cmake --preset conan-release
      - cmake --build --preset conan-release

  run:
    deps: [build]
    desc: Executes the compiled application
    cmds:
      - ./build/Release/app